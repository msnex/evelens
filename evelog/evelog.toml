[eve]
# redis or file
source = "redis"

[eve.redis]
url = "redis://127.0.0.1/"
key = "suricata"
cmd = "rpop"
batch_size = 50
worker_threads = 2

[eve.file]
filename = "/var/log/suricata/eve.json"

[clickhouse]
url = "http://127.0.0.1:8123"
database = "evelens"
user = "eve"
password = "change-me"
batch_size = 10000
flush_interval_ms = 1000

[runtime]
worker_threads = 2

[log]
# valid values: stdout, file
writer = "stdout"
# valid values: trace, debug, info, warn, error, off
level = "info"

[log.file]
# valid values: minutely, hourly, daily, weekly, never
rotation = "daily"
max_log_files = 5
directory = "/tmp"
filename = "evelens.log"
