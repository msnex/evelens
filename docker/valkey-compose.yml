name: valkey

services:
  valkey:
    image: valkey/valkey:9.1.2
    container_name: valkey
    network_mode: host
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 1gb --maxmemory-policy noeviction --save "" --appendonly no
    mem_swappiness: 0
    memswap_limit: 8g
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 8g
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6379 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
