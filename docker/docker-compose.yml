services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse
    network_mode: host
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}
    volumes:
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d
      - ${CLICKHOUSE_DATA_DIR}:/var/lib/clickhouse
      - ${CLICKHOUSE_LOGS_DIR}:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8123 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
