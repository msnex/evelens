[workspace]
resolver = "3"
members = ["console","crates/*", "evelog"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clickhouse = "0.15.3"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
core_affinity = "0.8.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
flume = "0.12.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "local-time",
] }
uuid = "1.28.0"

[profile.dev]
opt-level = 0
debug = "full"
panic = "abort"

[profile.release]
opt-level = 2
debug = "none"
panic = "abort"
